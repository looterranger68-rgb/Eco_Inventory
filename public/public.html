<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PRODUCT_NAME}} — EcoInventery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #F9FAFB;
      color: #111827;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .card {
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      padding: 28px 24px;
      height: fit-content;
      margin-top: 24px;
    }

    .brand {
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #15803D;
      font-weight: 600;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .category {
      display: inline-block;
      font-size: 0.75rem;
      color: #4B5563;
      background: #F3F4F6;
      border: 1px solid #E5E7EB;
      border-radius: 999px;
      padding: 3px 10px;
      margin-bottom: 20px;
    }

    .price {
      font-size: 1.9rem;
      font-weight: 700;
      color: #15803D;
      margin-bottom: 20px;
    }

    .price small {
      font-size: 0.8rem;
      font-weight: 400;
      color: #6B7280;
      display: block;
      margin-top: 2px;
    }

    .out-of-stock {
      font-size: 0.85rem;
      font-weight: 600;
      color: #B91C1C;
      margin-bottom: 20px;
    }

    dl { border-top: 1px solid #E5E7EB; }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #E5E7EB;
      font-size: 0.9rem;
    }

    dt { color: #6B7280; }
    dd { font-weight: 500; text-align: right; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">EcoInventery</div>
    <h1>{{PRODUCT_NAME}}</h1>
    <span class="category">{{PRODUCT_CATEGORY}}</span>
    {{PRICE_BLOCK}}
    <dl>
      <div class="row"><dt>Manufacturer date</dt><dd>{{MFG_DATE}}</dd></div>
      <div class="row"><dt>Expiry date</dt><dd>{{EXPIRY_DATE}}</dd></div>
    </dl>
  </main>
</body>
</html>
