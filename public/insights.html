<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insights & Stock Alerts — EcoInventery</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Site Navigation -->
  <header class="site-header">
    <div class="header-container">
      <a href="/index.html" class="brand-wrapper">
        <span class="brand-mark"></span>
        <span class="brand-title">EcoInventery</span>
      </a>

      <nav class="main-nav">
        <a href="/index.html" class="nav-link">Home</a>
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/inventory.html" class="nav-link">Inventory</a>
        <a href="/insights.html" class="nav-link">AI Insights</a>
        <a href="/qr-listings.html" class="nav-link">QR Listings</a>
      </nav>

      <div class="header-actions">
        <button id="btn-refresh" class="btn btn-sm" onclick="loadInsights()">↻ Refresh</button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="app-container">
    <div class="page-header">
      <div class="page-title-group">
        <h1>Insights &amp; Stock Alerts</h1>
        <p>What needs attention now — expiring stock and items that aren't selling.</p>
      </div>
      <div class="page-actions">
        <select id="days-filter" class="select-control" onchange="loadInsights()">
          <option value="7">Expiring within 7 days</option>
          <option value="14">Expiring within 14 days</option>
          <option value="30">Expiring within 30 days</option>
          <option value="90">Expiring within 90 days</option>
        </select>
      </div>
    </div>

    <!-- Two simple lists -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">

      <!-- Expiring Items -->
      <div class="panel">
        <div class="panel-header">
          <h2 class="panel-title">Expiring Soon</h2>
          <span class="badge badge-warning" id="expiring-count">0</span>
        </div>
        <div class="panel-body" id="expiring-list">
          <div class="empty-state">Loading…</div>
        </div>
      </div>

      <!-- Underperforming Items -->
      <div class="panel">
        <div class="panel-header">
          <h2 class="panel-title">Underperforming</h2>
          <span class="badge badge-danger" id="underperforming-count">0</span>
        </div>
        <div class="panel-body" id="underperforming-list">
          <div class="empty-state">Loading…</div>
        </div>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <span>EcoInventery &copy; 2026 — Stock Intelligence</span>
      <span class="badge badge-neutral">Updated live</span>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    async function loadInsights() {
      const days = document.getElementById('days-filter').value;
      try {
        const res = await API.get(`/api/insights?days=${days}`);
        const { expiringSoon, underperforming } = res.data;

        document.getElementById('expiring-count').textContent = expiringSoon.length;
        document.getElementById('underperforming-count').textContent = underperforming.length;

        const expBox = document.getElementById('expiring-list');
        if (expiringSoon.length === 0) {
          expBox.innerHTML = '<div class="empty-state">Nothing expiring in this window.</div>';
        } else {
          expBox.innerHTML = expiringSoon.map(item => `
            <div style="border-bottom: 1px solid var(--border-light); padding-bottom: 12px; margin-bottom: 12px;">
              <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
                <strong>${esc(item.name)}</strong>
                <span class="badge ${item.daysLeft < 0 ? 'badge-danger' : (item.daysLeft <= 3 ? 'badge-warning' : 'badge-neutral')}">
                  ${item.daysLeft < 0 ? `Expired ${-item.daysLeft}d ago` : item.daysLeft === 0 ? 'Expires today' : `${item.daysLeft}d left`}
                </span>
              </div>
              <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 2px;" class="col-mono">${item.quantity} in stock · expires ${esc(item.expiry_date)}</div>
              <div style="font-size: 0.82rem; color: var(--text-secondary); margin-top: 4px;">${esc(item.reason)}</div>
            </div>
          `).join('');
        }

        const undBox = document.getElementById('underperforming-list');
        if (underperforming.length === 0) {
          undBox.innerHTML = '<div class="empty-state">No underperforming items flagged.</div>';
        } else {
          undBox.innerHTML = underperforming.map(item => `
            <div style="border-bottom: 1px solid var(--border-light); padding-bottom: 12px; margin-bottom: 12px;">
              <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
                <strong>${esc(item.name)}</strong>
                <span class="badge ${item.sellThroughPct === 0 ? 'badge-danger' : 'badge-warning'}">${item.sellThroughPct}% sold</span>
              </div>
              <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 2px;" class="col-mono">${item.unitsSold30d} sold (30d) · ${item.quantity} in stock</div>
              <div style="font-size: 0.82rem; color: var(--text-secondary); margin-top: 4px;">${esc(item.reason)}</div>
            </div>
          `).join('');
        }
      } catch (err) {
        showToast('Error loading insights: ' + err.message, 'danger');
      }
    }

    loadInsights();
  </script>
</body>
</html>
